# FitSci infrastructure — local dev and VPS deployment.
#
# Quick start (infra only, app on host):
#   cp .env.example .env
#   docker compose up -d
#   cd backend && uv sync && uv run alembic upgrade head && uv run pytest -m "not integration"
#
# Full stack (API in Docker):
#   docker compose --profile app up -d --build
#
# VPS: set POSTGRES_HOST, RABBITMQ_HOST, OLLAMA_BASE_URL in .env to your server IP.
#      Run only the services you need on the VPS; point clients at those hosts.

name: fitsci

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitsci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitsci}
      POSTGRES_DB: ${POSTGRES_DB:-fitsci}
    ports:
      - "${POSTGRES_PORT_PUBLISH:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fitsci} -d ${POSTGRES_DB:-fitsci}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fitsci}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fitsci}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT_PUBLISH:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT_PUBLISH:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  ollama:
    image: ollama/ollama:0.30.10
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT_PUBLISH:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  migrate:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      OLLAMA_BASE_URL: http://ollama:11434
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "${API_PORT_PUBLISH:-8000}:8000"
    command:
      [
        "uvicorn",
        "src.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      OLLAMA_BASE_URL: http://ollama:11434
    command: ["python", "-m", "src.worker.main"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  rabbitmq_data:
  ollama_data:
