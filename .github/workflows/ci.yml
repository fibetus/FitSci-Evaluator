name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing -m "not integration"

      - name: Coverage gate (scoring.py)
        run: uv run pytest tests/test_scoring.py --cov=src.domain.services.scoring --cov-report=term-missing --cov-fail-under=90

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy --strict src
