[project]
name = "fitsci-evaluator"
version = "0.1.0"
description = "Evidence-Based Fitness AI powered by Gemma 4"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi",
    "uvicorn",
    "sqlmodel",
    "httpx",
    "python-dotenv",
]

[project.scripts]
fitsci-evaluate = "src.cli.main:run"

[tool.poetry]
name = "fitsci-evaluator"
version = "0.1.0"
description = "Evidence-Based Fitness AI powered by Gemma 4"
authors = ["Your Name <you@example.com>"]
packages = [{ include = "src" }]

[tool.poetry.scripts]
fitsci-evaluate = "src.cli.main:run"

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.0.0"
fastapi = "^0.100.0"
uvicorn = "^0.22.0"
sqlmodel = "^0.0.8"
httpx = "^0.24.0"
python-dotenv = "^1.0.0"
pymupdf = "^1.22.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
