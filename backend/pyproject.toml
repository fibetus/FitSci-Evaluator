[project]
name = "fitsci-evaluator"
version = "0.1.0"
description = "Evidence-Based Fitness AI powered by Gemma 4"
authors = [{ name = "FitSci" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "sqlmodel>=0.0.8",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",
    "aio-pika>=9.4.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.22.0",
]

[project.scripts]
fitsci-evaluate = "src.cli.main:run"
fitsci-worker = "src.worker.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.0.0",
    "testcontainers[postgres,rabbitmq]>=4.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that require Docker / external services",
]
